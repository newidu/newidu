<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" role="img" aria-label="Newidu signal in the noise animated banner">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c3c3a"/>
      <stop offset="28%" stop-color="#f4f4f2">
        <animate attributeName="offset" values="0.28;0.72;0.28" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#9a9aa2">
        <animate attributeName="offset" values="0.52;0.9;0.52" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="76%" stop-color="#f4f4f2">
        <animate attributeName="offset" values="0.76;0.32;0.76" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3c3c3a"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="clip"><rect width="1200" height="112" rx="2"/></clipPath>
  </defs>
  <rect width="1200" height="112" fill="#0a0a0a"/>
  <g clip-path="url(#clip)">
    <rect width="1200" height="112" fill="url(#grain)" opacity="0.6">
      <animate attributeName="x" values="-18;18;-18" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;-12;12" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <path d="M0 82 H1200" stroke="#f4f4f2" stroke-opacity=".18"/>
    <path d="M0 28 H1200" stroke="#f4f4f2" stroke-opacity=".12"/>
    <path d="M0 82 H1200" stroke="url(#silver)" stroke-width="2" stroke-dasharray="90 42">
      <animate attributeName="stroke-dashoffset" values="0;-264;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <g fill="#f4f4f2" font-family="monospace" font-size="13" letter-spacing="4">
      <text y="22">// NEWIDU / BLACK · WHITE · SILVER</text>
      <text y="66" font-size="22" font-weight="700" letter-spacing="7">SIGNAL IN THE NOISE.</text>
      <text y="103" fill="#9a9aa2" font-size="10" letter-spacing="3">OPEN SOURCE  ·  CYBERSECURITY  ·  AI AGENTS  ·  CRYPTO INTELLIGENCE</text>
    </g>
    <rect x="0" y="0" width="3" height="112" fill="#f4f4f2" opacity=".9">
      <animate attributeName="x" values="-10;1210;-10" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="110" fill="none" stroke="#f4f4f2" stroke-opacity=".22"/>
</svg>
